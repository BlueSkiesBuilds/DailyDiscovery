name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Get Gradle wrapper jar
        run: |
          curl -L -o /tmp/gradle-bin.zip \
            https://services.gradle.org/distributions/gradle-8.4-bin.zip
          mkdir -p gradle/wrapper
          JAR=$(unzip -l /tmp/gradle-bin.zip | grep 'gradle-wrapper.jar' | awk '{print $4}')
          unzip -p /tmp/gradle-bin.zip "$JAR" > gradle/wrapper/gradle-wrapper.jar
          python3 -c "
          data = open('gradle/wrapper/gradle-wrapper.jar
