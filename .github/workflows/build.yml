name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.4
        run: |
          curl -L -o /tmp/gradle-8.4-bin.zip \
            https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -d /opt/gradle /tmp/gradle-8.4-bin.zip
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set build version
        run: |
          BUILD=${{ github.run_number }}
          sed -i "s/versionCode [0-9]*/versionCode $BUILD/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.$BUILD\"/" app/build.gradle
          sed -i "s/Version [0-9][0-9.]*/Version 1.$BUILD/" app/src/main/assets/app.html

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyDiscovery-debug
          path: app/build/outputs/apk/debug/app-debug.apk
